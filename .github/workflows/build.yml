name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 面談チェック（フェーズ2・4）
      - name: Build MendanApp
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # 面談録音（フェーズ1）
      - name: Build OkoshiApp
        run: gradle :okoshi:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MendanApp-debug
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OkoshiApp-debug
          path: okoshi/build/outputs/apk/debug/*.apk
